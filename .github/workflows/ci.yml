name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Unit and integrity tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run integrity checks
        run: python -m pytest -v

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks (version-locked, checksum-verified)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      - name: Scan full history for secrets
        run: ./gitleaks git . --redact --verbose

  sca:
    name: Dependency scan (pip-audit) + SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit (version-locked)
        run: pip install pip-audit==2.10.1

      - name: Scan libraries for known vulnerabilities (GATE)
        run: pip-audit -r requirements.txt --aliases on

      - name: Generate SBOM - ingredients list (EVIDENCE)
        if: always()
        run: pip-audit -r requirements.txt -f cyclonedx-json -o sbom.cdx.json || true

      - name: Keep SBOM with this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  sast:
    name: Code scan (Bandit SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit (version-locked)
        run: pip install bandit==1.9.4

      - name: Scan our own code for insecure patterns (GATE - medium and above)
        run: bandit -r app -ll
